<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Edit Event</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/scripts/event_create_scripts.js"></script>
</head>

<body class="bg-gray-100 p-6 min-h-screen">

<div class="max-w-xl mx-auto bg-white shadow p-6 rounded">

    <h1 class="text-xl font-bold mb-4">Edit Event</h1>

    <form id="form" class="grid gap-3">

        <input type="hidden" id="sportsday" />

        <label>Name
            <input id="name" class="border rounded w-full px-3 py-2" required />
        </label>

        <label>Year Group
            <select id="year_group" class="border rounded w-full px-3 py-2" required>
                <!-- Options will be populated dynamically -->
            </select>
        </label>

        <label>Category
            <select id="category" class="border rounded w-full px-3 py-2">
                <option value="track">Track</option>
                <option value="field">Field</option>
            </select>
        </label>

        <label>Result Format
            <select id="result_format" class="border rounded w-full px-3 py-2">
                <option value="integer">Integer</option>
                <option value="real">Real</option>
                <option value="duration">Duration</option>
            </select>
        </label>

        <label>Min participants
            <input id="min" type="number" class="border rounded w-full px-3 py-2" />
        </label>

        <label>Max participants
            <input id="max" type="number" class="border rounded w-full px-3 py-2" />
        </label>

        <label>Scoring cutoff N
            <input id="cutoff" type="number" class="border rounded w-full px-3 py-2" />
        </label>

        <label>Points for 1st
            <input id="p1" type="number" class="border rounded w-full px-3 py-2" />
        </label>

        <label>Points for Nth
            <input id="pn" type="number" class="border rounded w-full px-3 py-2" />
        </label>

        <button class="bg-blue-600 text-white px-3 py-2 rounded">
            Save Changes
        </button>

    </form>

</div>

<script>
    const eventId = parseInt(window.location.pathname.split("/").slice(-2)[0]);

    async function initYearGroupDropdown(sportsDayId) {
            const yearGroups = await loadYearGroups(sportsDayId);
            populateYearGroupSelect(yearGroups);
        }

    async function loadEvent() {
        const e = await fetch(`/events/${eventId}`).then(r => r.json());

        initYearGroupDropdown(e.sports_day_id);


        document.getElementById("name").value = e.name;
        document.getElementById("year_group").value = e.year_group;
        document.getElementById("category").value = e.category;
        document.getElementById("result_format").value = e.result_format;
        document.getElementById("min").value = e.min_participants;
        document.getElementById("max").value = e.max_participants;
        document.getElementById("cutoff").value = e.scoring_places;
        document.getElementById("p1").value = e.points_1st;
        document.getElementById("pn").value = e.points_nth;
        document.getElementById("sportsday").value = e.sports_day_id;
    }

    document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();

        if (!validateForm())
        {
            return;
        }

        await fetch(`/events/${eventId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: document.getElementById("name").value,
                year_group: document.getElementById("year_group").value,
                category: document.getElementById("category").value,
                result_format: document.getElementById("result_format").value,
                min_participants: parseInt(document.getElementById("min").value),
                max_participants: parseInt(document.getElementById("max").value),
                scoring_places: parseInt(document.getElementById("cutoff").value),
                points_1st: parseInt(document.getElementById("p1").value),
                points_nth: parseInt(document.getElementById("pn").value)
            })
        });

        alert("Event updated.");
        window.location.href = `/admin/sportsday/${document.getElementById("sportsday").value}`;
    };

    loadEvent();
</script>

</body>
</html>
