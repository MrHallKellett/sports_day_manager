<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Edit Event</title>
<link rel="stylesheet" href="/static/style.css"/>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6 min-h-screen">

<div id="mount"></div>

<!-- Load the form HTML -->
<script>
fetch("/static/event_form.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("mount").innerHTML = html;

        // Now that the HTML is loaded, load the script that uses it.
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/static/scripts/pages/event_form.js';
        document.body.appendChild(script);
    });
</script>

</body>
</html>
