<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Create Event</title>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 p-6 min-h-screen">

<div id="mount"></div>

<script src="/static/scripts/api/sportsdays.js"></script>
<script src="/static/scripts/ui/forms.js"></script>
<script src="/static/scripts/domain/validation.js"></script>

<script>
fetch("/static/event_form.html")
    .then(r => r.text())
    .then(html => {
        document.getElementById("mount").innerHTML = html;
        const s = document.createElement("script");
        s.src = "/static/scripts/pages/event_form.js";
        document.body.appendChild(s);
    });
</script>

</body>
</html>
