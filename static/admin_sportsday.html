<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sports Day Management</title>
<link rel="stylesheet" href="/static/style.css"/>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-7xl mx-auto p-4">

    <h1 id="title" class="text-2xl font-bold mb-4">Sports Day</h1>

    <!-- STATUS -->
    <div class="bg-white shadow p-4 rounded mb-6">
        <h2 class="font-semibold mb-2">Status</h2>
        <select id="status" class="border rounded px-3 py-2">
            <option value="registering">Registering participants</option>
            <option value="recording">Recording results</option>
        </select>
        <button onclick="saveStatus()" class="ml-2 bg-blue-600 text-white px-3 py-2 rounded">
            Save
        </button>
    </div>

    <!-- TABS -->
    <div class="mb-4 border-b border-gray-200">
        <nav class="-mb-px flex space-x-6" aria-label="Tabs">
            <button data-tab="requirements" class="tab-button whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm">Requirements</button>
            <button data-tab="events" class="tab-button whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm">Events</button>
            <button data-tab="students" class="tab-button whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm">Students</button>
            <button data-tab="staff" class="tab-button whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm">Staff</button>
        </nav>
    </div>

    <!-- TAB PANES -->
    <div id="tab-panes-container">
        <!-- REQUIREMENTS PANE -->
        <div id="requirements-pane" data-pane="requirements" class="tab-pane">
            <div class="bg-white shadow p-4 rounded">
    <h2 class="font-semibold mb-3">Student Requirements</h2>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label>Field minimum</label>
            <input id="fieldMin" type="number" class="w-full border rounded px-3 py-2" />
        </div>
        <div>
            <label>Track minimum</label>
            <input id="trackMin" type="number" class="w-full border rounded px-3 py-2" />
        </div>
        <div>
            <label>Overall maximum</label>
            <input id="overallMax" type="number" class="w-full border rounded px-3 py-2" />
        </div>

        <br>

        <fieldset class="border p-4 rounded">
            <legend class="font-semibold mb-2">Houses</legend>
            <div class="grid grid-cols-2 gap-2 text-sm" id="houseNameContainer">
                <label>House 1 Name:
                <input id="house1"  class="w-full border rounded px-3 py-2" />
                </label>
                <label>House 2 Name:
                    <input id="house2"  class="w-full border rounded px-3 py-2" />
                </label>
            </div>
            <button id="addHouseBtn">Add House</button>
        </fieldset>

        <fieldset class="border p-4 rounded">
            <legend class="font-semibold mb-2">Year Groups</legend>
          
            <div class="grid grid-cols-2 gap-2 text-sm">
          
              <!-- Year 1–9 -->
              <label><input class="yearGroup" type="checkbox" class="year" value="1" id="y1"> Year 1</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="2" id="y2"> Year 2</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="3" id="y3"> Year 3</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="4" id="y4"> Year 4</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="5" id="y5"> Year 5</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="6" id="y6"> Year 6</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="7" id="y7"> Year 7</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="8" id="y8"> Year 8</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="9" id="y9"> Year 9</label>
          
              <!-- Year 10–13 -->
              <label><input class="yearGroup" type="checkbox" class="year" value="10" id="y10"> Year 10</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="11" id="y11"> Year 11</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="12" id="y12"> Year 12</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="13" id="y13"> Year 13</label>


            </div>
          
            <div class="mt-4 space-y-2">
              <label class="block font-medium">
                <input type="checkbox" id="combineKS4">
                Combine Year 10 &amp; 11 → KS4
              </label>
          
              <label class="block font-medium">
                <input type="checkbox" id="combineKS5">
                Combine Year 12 &amp; 13 → KS5
              </label>
            </div>



          </fieldset>
    </div>

    <button id="saveRequirementsBtn"
            class="mt-3 bg-blue-600 text-white px-3 py-2 rounded">
        Save Requirements
    </button>
            </div>
        </div>

        <!-- EVENTS PANE -->
        <div id="events-pane" data-pane="events" class="tab-pane">
            <div class="bg-white shadow p-4 rounded">
        <div class="flex justify-between items-center mb-3">
            <h2 class="font-semibold">Events</h2>
            <div class="event-actions">
                
                <a id="createEventBtn">
                    <button class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700">
                        Create New Event
                    </button>
                </a>
              
                <button id="duplicateEventBtn"
                class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700">
                  Duplicate Existing Event
                </button>
              
                <div id="duplicatePanel" class="duplicate-panel hidden">
                  <select id="duplicateSelect">
                    <option value="">-- Select an event to duplicate --</option>
                  </select>
                </div>
              </div>
  
        </div>

        <div class="mb-3 text-sm">
            <span class="inline-block bg-red-100 border border-red-300 px-2 py-1 rounded">
                Red fields indicate configuration issues — hover for details
            </span>
        </div>

        <div class="mt-4 overflow-x-auto">
            <table id="eventsTable" class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <!-- This content is replaced by JS -->
                </thead>
                <tbody id="eventsTableBody" class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td colspan="12" class="py-4 text-center text-gray-500">
                            Loading events...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
            </div>
        </div>

        <!-- STUDENTS PANE -->
        <div id="students-pane" data-pane="students" class="tab-pane">
            <div id="students-section" class="bg-white shadow p-4 rounded">        
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-semibold text-lg">Students</h2>
            <div>
                <input type="file" id="csvFile" accept=".csv" class="hidden" />
                <button
                    type="button"
                    onclick="document.getElementById('csvFile').click()"
                    class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">
                    Upload CSV
                </button>
                <button
                    id="downloadStudentTemplateBtn"
                    type="button"
                    class="ml-2 bg-gray-600 text-white px-3 py-2 rounded hover:bg-gray-700">
                    Download CSV Template
                </button>
                <button id="showHighlightsBtn"
                    type="button"
                    class="ml-4 bg-gray-200 text-gray-800 px-3 py-2 rounded hover:bg-gray-300">
                    Show Highlights
                </button>
            </div>
        </div>

        <!-- Add New Student Form -->
        <form id="newStudentForm" class="mb-6 border-b pb-6">
            <h3 class="font-semibold mb-2">Add New Student</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div class="md:col-span-2">
                    <label for="newStudentName" class="block text-sm font-medium text-gray-700">Student Name</label>
                    <input id="newStudentName" class="mt-1 border rounded px-2 py-1 w-full" placeholder="Name" />
                </div>
                <div>
                    <label for="newStudentHouse" class="block text-sm font-medium text-gray-700">House</label>
                    <select id="newStudentHouse" class="mt-1 border rounded px-2 py-1 w-full"><option value="">Select House...</option></select>
                </div>
                <div>
                    <label for="newStudentYear" class="block text-sm font-medium text-gray-700">Year</label>
                    <select id="newStudentYear" class="mt-1 border rounded px-2 py-1 w-full"><option value="">Select Year...</option></select>
                </div>
            </div>
            <button type="submit" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Student</button>
        </form>

        <!-- Upload warnings -->
        <div id="uploadWarnings" class="hidden warning-box mb-4"></div>

        <!-- Students Table (full width) -->
        <div class="overflow-auto h-[60vh] border rounded">
            <table class="min-w-full text-sm">
                <thead>
                    <tr id="student-header-row" class="text-left border-b"></tr>
                    <tr id="student-filter-row" class="text-left border-b"></tr>
                </thead>
                <tbody id="studentsTable">
                    <tr>
                        <td colspan="4"
                            class="py-4 text-center text-gray-500">
                            No students loaded
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
            </div>
        </div>

        <!-- STAFF PANE -->
        <div id="staff-pane" data-pane="staff" class="tab-pane">
            <div id="staff-section" class="bg-white shadow p-4 rounded">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-semibold text-lg">Staff Management</h2>
            <div>
                <input type="file" id="staffCsvFile" accept=".csv" class="hidden" />
                <button
                    type="button"
                    onclick="document.getElementById('staffCsvFile').click()"
                    class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">
                    Upload CSV
                </button>
                <button id="downloadStaffTemplateBtn"
                    class="ml-2 bg-gray-600 text-white px-3 py-2 rounded hover:bg-gray-700">
                    Download CSV Template
                </button>
            </div>
        </div>

        <!-- Add New Staff Form -->
        <form id="newStaffForm" class="mb-6 border-b pb-6">
            <h3 class="font-semibold mb-2">Add New Staff Member</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Name and Roles -->
                <div>
                    <label for="newStaffName" class="block text-sm font-medium text-gray-700">Staff Member Name</label>
                    <input type="text" id="newStaffName" class="mt-1 block w-full border rounded px-3 py-2" required>

                    <label for="newStaffEmail" class="block text-sm font-medium text-gray-700 mt-4">Email (Optional)</label>
                    <input type="email" id="newStaffEmail" class="mt-1 block w-full border rounded px-3 py-2">

                    <fieldset class="mt-4">
                        <legend class="text-sm font-medium text-gray-700">Roles</legend>
                        <div class="mt-2 space-y-2">
                            <label class="flex items-center"><input type="checkbox" id="roleFormTutor" name="roles" value="Form Tutor" class="mr-2"> Form Tutor</label>
                            <label class="flex items-center"><input type="checkbox" id="roleEventSteward" name="roles" value="Event Steward" class="mr-2"> Event Steward</label>
                        </div>
                    </fieldset>
                </div>

                <!-- Assignments -->
                <div>
                    <div id="formTutorAssignments" class="hidden">
                        <label for="assignClasses" class="block text-sm font-medium text-gray-700">Assign Classes</label>
                        <select id="assignClasses" multiple class="mt-1 block w-full border rounded px-3 py-2 h-24"></select>
                    </div>
                    <div id="eventStewardAssignments" class="hidden mt-4">
                        <label for="assignEvents" class="block text-sm font-medium text-gray-700">Assign Events</label>
                        <select id="assignEvents" multiple class="mt-1 block w-full border rounded px-3 py-2 h-24"></select>
                    </div>
                </div>
            </div>
            <button type="submit" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Staff Member</button>
        </form>

        <!-- Staff Table -->
        <div class="overflow-auto h-[40vh] border rounded">
            <table class="min-w-full text-sm">
                <thead>
                    <tr id="staff-header-row" class="text-left border-b"></tr>
                    <tr id="staff-filter-row" class="text-left border-b"></tr>
                </thead>
                <tbody id="staffTable">
                    <tr><td colspan="5" class="py-4 text-center text-gray-500">Loading staff...</td></tr>
                </tbody>
            </table>
        </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script type="module" src="/static/scripts/pages/admin_sportsday.js"></script>



</body>
</html>
