<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sports Day Management</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-4xl mx-auto p-4">

    <h1 id="title" class="text-2xl font-bold mb-4">Sports Day</h1>

    <!-- STATUS -->
    <div class="bg-white shadow p-4 rounded mb-6">
        <h2 class="font-semibold mb-2">Status</h2>
        <select id="status" class="border rounded px-3 py-2">
            <option value="registering">Registering participants</option>
            <option value="recording">Recording results</option>
        </select>
        <button onclick="saveStatus()" class="ml-2 bg-blue-600 text-white px-3 py-2 rounded">
            Save
        </button>
    </div>

    <!-- REQUIREMENTS -->
<div class="bg-white shadow p-4 rounded mb-6">
    <h2 class="font-semibold mb-3">Student Requirements</h2>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label>Field minimum</label>
            <input id="fieldMin" type="number" class="w-full border rounded px-3 py-2" />
        </div>
        <div>
            <label>Track minimum</label>
            <input id="trackMin" type="number" class="w-full border rounded px-3 py-2" />
        </div>
        <div>
            <label>Overall maximum</label>
            <input id="overallMax" type="number" class="w-full border rounded px-3 py-2" />
        </div>

        <br>

        <fieldset class="border p-4 rounded">
            <legend class="font-semibold mb-2">Houses</legend>
            <div class="grid grid-cols-2 gap-2 text-sm" id="houseNameContainer">
                <label>House 1 Name:
                <input id="house1"  class="w-full border rounded px-3 py-2" />
                </label>
                <label>House 2 Name:
                    <input id="house1"  class="w-full border rounded px-3 py-2" />
                </label>
            </div>
            <button onclick="addHouse()" id="addHouseBtn">Add House</button>
        </fieldset>

        <fieldset class="border p-4 rounded">
            <legend class="font-semibold mb-2">Year Groups</legend>
          
            <div class="grid grid-cols-2 gap-2 text-sm">
          
              <!-- Year 1–9 -->
              <label><input class="yearGroup" type="checkbox" class="year" value="1" id="y1"> Year 1</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="2" id="y2"> Year 2</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="3" id="y3"> Year 3</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="4" id="y4"> Year 4</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="5" id="y5"> Year 5</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="6" id="y6"> Year 6</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="7" id="y7"> Year 7</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="8" id="y8"> Year 8</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="9" id="y9"> Year 9</label>
          
              <!-- Year 10–13 -->
              <label><input class="yearGroup" type="checkbox" class="year" value="10" id="y10"> Year 10</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="11" id="y11"> Year 11</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="12" id="y12"> Year 12</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="13" id="y13"> Year 13</label>


            </div>
          
            <div class="mt-4 space-y-2">
              <label class="block font-medium">
                <input type="checkbox" id="combineKS4">
                Combine Year 10 &amp; 11 → KS4
              </label>
          
              <label class="block font-medium">
                <input type="checkbox" id="combineKS5">
                Combine Year 12 &amp; 13 → KS5
              </label>
            </div>



          </fieldset>
    </div>

    <button onclick="saveRequirements()" class="mt-3 bg-blue-600 text-white px-3 py-2 rounded">
        Save Requirements
    </button>
</div>


    <!-- EVENTS LIST -->
    <div class="bg-white shadow p-4 rounded">
        <div class="flex justify-between items-center mb-3">
            <h2 class="font-semibold">Events</h2>
            <div class="event-actions">
                
                <a id="createEventBtn">
                    <button class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700">
                        Create New Event
                    </button>
                </a>
              
                <button id="duplicateEventBtn"
                class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700">
                  Duplicate Existing Event
                </button>
              
                <div id="duplicatePanel" class="duplicate-panel hidden">
                  <select id="duplicateSelect">
                    <option value="">-- Select an event to duplicate --</option>
                  </select>
                </div>
              </div>
  
        </div>

        <table class="min-w-full text-sm">
            <thead>
                <tr class="text-left border-b">
                    <th class="py-2">Name</th>
                    <th class="py-2">Year</th>
                    <th class="py-2">Category</th>
                    <th class="py-2">Actions</th>
                </tr>
            </thead>
            <tbody id="eventsTable"></tbody>
        </table>
    </div>

    <!-- STUDENTS SECTION - Add this after the REQUIREMENTS section and before EVENTS LIST -->
    <div class="bg-white shadow p-4 rounded mb-6">
        <h2 class="font-semibold mb-3">Students</h2>
        
        <!-- CSV Upload -->
        <div class="mb-4">
            <input type="file" id="csvFile" accept=".csv" class="hidden" />
            <button onclick="document.getElementById('csvFile').click()" 
                    class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">
                Upload CSV
            </button>
            <span id="csvFileName" class="ml-2 text-sm text-gray-600"></span>
        </div>

        <div id="uploadWarnings" class="hidden warning-box"></div>
        
        <!-- Students Table -->
        <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
                <thead>
                    <tr class="text-left border-b">
                        <th class="py-2">Name</th>
                        <th class="py-2">House</th>
                        <th class="py-2">Year Group</th>
                        <th class="py-2">Events Registered</th>
                    </tr>
                </thead>
                <tbody id="studentsTable">
                    <tr>
                        <td colspan="4" class="py-4 text-center text-gray-500">No students loaded</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const sportsdayId = parseInt(window.location.pathname.split("/").pop());

    function eventAllowsStudent(event, student) {
        const yg = event.year_group;

        if (yg === "KS4") return student.year === 10 || student.year === 11;
        if (yg === "KS5") return student.year === 12 || student.year === 13;

        return student.year === yg;
    }

    function indexIssues(issues = []) {
        const map = {};
        for (const i of issues) {
            map[i.name] = i;
        }
        return map;
    }

    function addHouse() {
        const houseNames = document.getElementById("houseNameContainer");
        
        // Count existing houses to determine the next house number
        const houseCount = houseNames.children.length + 1;
        
        // Create label element
        const label = document.createElement("label");
        label.textContent = `House ${houseCount} Name: `;
        
        // Create input element
        const input = document.createElement("input");
        input.id = `house${houseCount}`;
        input.className = "w-full border rounded px-3 py-2";
        
        // Append input to label
        label.appendChild(input);
        
        // Append label to container
        houseNames.appendChild(label);
    }

    async function loadDuplicateOptions() {
        const options = await fetch("/events/duplicate-options")
            .then(r => r.json());

        const select = document.getElementById("duplicateSelect");

        for (const opt of options) {
            select.add(
                new Option(
                    `${opt.sports_day_name} – ${opt.event_name}`,
                    opt.event_id
                )
            );
        }
    }
    function showUploadWarning(issues) {
        const box = document.getElementById("uploadWarnings");
        box.classList.remove("hidden");

        box.innerHTML = `
            <strong>Warning:</strong>
            ${issues.length} student(s) have houses or years not configured
            for this sports day.
        `;
    }

    // LOAD PAGE
    async function loadSportsDay() {
        const d = await fetch(`/sportsdays/${sportsdayId}`).then(r => r.json());
        document.getElementById("title").textContent = `Sports Day ${d.year}`;
        document.getElementById("status").value = d.status;
        document.getElementById("createEventBtn").href = `/admin/events/new?sportsday=${sportsdayId}`;

        // Load settings
        const settings = await fetch(`/sportsdays/${sportsdayId}/settings`).then(r => r.json());
        document.getElementById("fieldMin").value = settings.field_min || 0;
        document.getElementById("trackMin").value = settings.track_min || 0;
        document.getElementById("overallMax").value = settings.overall_max || 0;

        if (settings.houses) {
            const inputs = document.querySelectorAll("#houseNameContainer input");
            
            // Populate the first two default fields
            settings.houses.forEach((house, index) => {
                if (index < 2) {
                    // Fill existing fields
                    inputs[index].value = house;
                }
                else {
                    // Add new fields for additional houses
                    addHouse();
                    // Get the newly added input and set its value
                    const newInputs = document.querySelectorAll("#houseNameContainer input");
                    newInputs[newInputs.length - 1].value = house;
                }
            });
        }

        // Load year groups
        if (settings.year_groups) {
            
            for (const yg of settings.year_groups) {
                if (yg === "KS4") {
                    combineKS4.checked = true;
                    y10.disabled = true;
                    y11.disabled = true;
                } else if (yg === "KS5") {
                    combineKS5.checked = true;
                    y12.disabled = true;
                    y13.disabled = true;
                } else {
                    const cb = document.getElementById(`y${yg}`);
                    if (cb) cb.checked = true;
                }
            }
        }

        // Load events
        loadEvents();
    }

    let duplicateLoaded = false;

    document
        .getElementById("duplicateEventBtn")
        .addEventListener("click", async () => {
            const panel = document.getElementById("duplicatePanel");
            panel.classList.toggle("hidden");

            if (!duplicateLoaded && !panel.classList.contains("hidden")) {
                await loadDuplicateOptions();
                duplicateLoaded = true;
            }
        });

    async function duplicateSelectedEvent() {
        const select = document.getElementById("duplicateSelect");
        const selectedEventId = select.value;

        if (!selectedEventId) return;

        select.disabled = true;

        const response = await fetch(
            `/sportsdays/${sportsdayId}/events/duplicate`,
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    source_event_id: selectedEventId
                })
            }
        );

        select.classList.add("hidden");
        select.disabled = false;
        select.value = "";

        if (!response.ok) {
            alert("Failed to duplicate event.");
            return;
        }

        await response.json();
        window.location.href = `/admin/sportsday/${sportsdayId}`;
    }

    async function loadEvents() {
        const events = await fetch("/events").then(r => r.json());
        const rows = events
            .filter(e => e.sports_day_id === sportsdayId)
            .map(e => `
                <tr class="border-b">
                    <td class="py-2">${e.name}</td>
                    <td class="py-2">${e.year_group}</td>
                    <td class="py-2">${e.category}</td>
                    <td class="py-2">
                        <a href="/admin/events/${e.id}/edit" class="text-blue-600 hover:underline">Edit</a>
                        <button onclick="deleteEvent(${e.id})" class="text-red-600 hover:underline cursor-pointer bg-transparent border-0">Delete</button>
                    </td>
                </tr>
            `)
            .join("");

        document.getElementById("eventsTable").innerHTML = rows;
    }

    async function loadStudents(issues = []) {
        const issueMap = indexIssues(issues);

        const data = await fetch(
            `/sportsdays/${sportsdayId}/students`
        ).then(r => r.json());

        const { students, events, participation } = data;

        const thead = document
            .querySelector("#studentsTable")
            .closest("table")
            .querySelector("thead tr");

        // Rebuild header
        thead.innerHTML = `
            <th>Name</th>
            <th>House</th>
            <th>Year</th>
            ${events.map(e => `<th>${e.name}</th>`).join("")}
        `;

        const tbody = document.getElementById("studentsTable");
        tbody.innerHTML = "";

        for (const s of students) {
            const issue = issueMap[s.name];
            const tr = document.createElement("tr");

            const houseClass = issue?.house_invalid ? "cell-warning" : "";
            const yearClass = issue?.year_invalid ? "cell-warning" : "";

            tr.innerHTML = `
                <td>${s.name}</td>
                <td class="${houseClass}">${s.house}</td>
                <td class="${yearClass}">${s.year}</td>
            `;

            for (const e of events) {
                const allowed = eventAllowsStudent(e, s);
                const checked = participation[s.id]?.includes(e.id);

                const cb = document.createElement("input");
                cb.type = "checkbox";
                    
                cb.disabled = !allowed;

                cb.addEventListener("change", () =>
                    toggleParticipation(e.id, s.id, cb.checked)
                );

                const td = document.createElement("td");
                td.appendChild(cb);
                tr.appendChild(td);
            }

            tbody.appendChild(tr);
        }
    }

    async function saveStatus() {
        const status = document.getElementById("status").value;
        await fetch(`/sportsdays/${sportsdayId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status })
        });
        alert("Status saved.");
    }

    async function toggleParticipation(eventId, studentId, on) {
        const url = `/events/${eventId}/participants` +
            (on ? "" : `/${studentId}`);

        const opts = on
            ? {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ student_id: studentId })
            }
            : { method: "DELETE" };

        const res = await fetch(url, opts);

        if (!res.ok) {
            alert("Unable to update participation");
        }
    }

    function getHouses() {
        return Array.from(document.querySelectorAll("#houseNameContainer input"))
        .map(input => input.value.trim())
        .filter(value => value !== "");
    }

    function getSelectedYearGroups() {
        const selected = [];

        document
            .querySelectorAll(".yearGroup:checked")
            .forEach(cb => {
                const y = parseInt(cb.value);

                if (
                    (y === 10 || y === 11) && combineKS4.checked ||
                    (y === 12 || y === 13) && combineKS5.checked
                ) {
                    return;
                }

                selected.push(y);
            });

        if (combineKS4.checked) selected.push("KS4");
        if (combineKS5.checked) selected.push("KS5");

        return selected;
    }

    async function deleteEvent(eventId) {
        // Confirm before deleting
        if (!confirm("Are you sure you want to delete this event?")) {
            return;
        }

        try {
            const response = await fetch(`/events/${eventId}`, {
                method: "DELETE"
            });

            if (response.ok) {
                // Reload the page after successful deletion
                window.location.reload();
            } else {
                alert("Failed to delete event.");
            }
        } catch (error) {
            alert("Error deleting event: " + error.message);
        }
    }

    async function saveRequirements() {
        await fetch(
            `/sportsdays/${sportsdayId}/settings`,
            {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    field_min: fieldMin.value,
                    track_min: trackMin.value,
                    overall_max: overallMax.value,
                    year_groups: getSelectedYearGroups(),
                    houses: getHouses()
                })
            }
        );
        alert("Requirements saved.");
    }

    document
        .getElementById("duplicateSelect")
        .addEventListener("change", duplicateSelectedEvent);

    // Year group combine logic
    const combineKS4 = document.getElementById("combineKS4");
    const combineKS5 = document.getElementById("combineKS5");

    const y10 = document.getElementById("y10");
    const y11 = document.getElementById("y11");
    const y12 = document.getElementById("y12");
    const y13 = document.getElementById("y13");

    combineKS4.addEventListener("change", () => {
        const on = combineKS4.checked;
        y10.checked = false;
        y11.checked = false;
        y10.disabled = on;
        y11.disabled = on;
    });

    combineKS5.addEventListener("change", () => {
        const on = combineKS5.checked;
        y12.checked = false;
        y13.checked = false;
        y12.disabled = on;
        y13.disabled = on;
    });

    

    document.getElementById("csvFile").addEventListener("change", async e => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById("csvFileName").textContent = file.name;

        const form = new FormData();
        form.append("file", file);

        

        const res = await fetch(
        `/sportsdays/${sportsdayId}/students/upload`,
            { method: "POST", body: form }
        );

        if (!res.ok) {
            const message = await res.text();
            alert(message);
            console.log(message);   
            return;
        }

        const result = await res.json();
        if (result.issues?.length) {
            showUploadWarning(result.issues);
        }

        await loadStudents(result.issues);

            

        

    });


    loadSportsDay();

</script>

</body>
</html>
