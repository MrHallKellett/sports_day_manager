<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sports Day Management</title>
<link rel="stylesheet" href="/static/style.css"/>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-4xl mx-auto p-4">

    <h1 id="title" class="text-2xl font-bold mb-4">Sports Day</h1>

    <!-- STATUS -->
    <div class="bg-white shadow p-4 rounded mb-6">
        <h2 class="font-semibold mb-2">Status</h2>
        <select id="status" class="border rounded px-3 py-2">
            <option value="registering">Registering participants</option>
            <option value="recording">Recording results</option>
        </select>
        <button onclick="saveStatus()" class="ml-2 bg-blue-600 text-white px-3 py-2 rounded">
            Save
        </button>
    </div>

    <!-- REQUIREMENTS -->
<div class="bg-white shadow p-4 rounded mb-6">
    <h2 class="font-semibold mb-3">Student Requirements</h2>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label>Field minimum</label>
            <input id="fieldMin" type="number" class="w-full border rounded px-3 py-2" />
        </div>
        <div>
            <label>Track minimum</label>
            <input id="trackMin" type="number" class="w-full border rounded px-3 py-2" />
        </div>
        <div>
            <label>Overall maximum</label>
            <input id="overallMax" type="number" class="w-full border rounded px-3 py-2" />
        </div>

        <br>

        <fieldset class="border p-4 rounded">
            <legend class="font-semibold mb-2">Houses</legend>
            <div class="grid grid-cols-2 gap-2 text-sm" id="houseNameContainer">
                <label>House 1 Name:
                <input id="house1"  class="w-full border rounded px-3 py-2" />
                </label>
                <label>House 2 Name:
                    <input id="house1"  class="w-full border rounded px-3 py-2" />
                </label>
            </div>
            <button id="addHouseBtn">Add House</button>
        </fieldset>

        <fieldset class="border p-4 rounded">
            <legend class="font-semibold mb-2">Year Groups</legend>
          
            <div class="grid grid-cols-2 gap-2 text-sm">
          
              <!-- Year 1–9 -->
              <label><input class="yearGroup" type="checkbox" class="year" value="1" id="y1"> Year 1</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="2" id="y2"> Year 2</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="3" id="y3"> Year 3</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="4" id="y4"> Year 4</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="5" id="y5"> Year 5</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="6" id="y6"> Year 6</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="7" id="y7"> Year 7</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="8" id="y8"> Year 8</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="9" id="y9"> Year 9</label>
          
              <!-- Year 10–13 -->
              <label><input class="yearGroup" type="checkbox" class="year" value="10" id="y10"> Year 10</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="11" id="y11"> Year 11</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="12" id="y12"> Year 12</label>
              <label><input class="yearGroup" type="checkbox" class="year" value="13" id="y13"> Year 13</label>


            </div>
          
            <div class="mt-4 space-y-2">
              <label class="block font-medium">
                <input type="checkbox" id="combineKS4">
                Combine Year 10 &amp; 11 → KS4
              </label>
          
              <label class="block font-medium">
                <input type="checkbox" id="combineKS5">
                Combine Year 12 &amp; 13 → KS5
              </label>
            </div>



          </fieldset>
    </div>

    <button id="saveRequirementsBtn"
            class="mt-3 bg-blue-600 text-white px-3 py-2 rounded">
        Save Requirements
    </button>
</div>


    <!-- EVENTS LIST -->
    <div class="bg-white shadow p-4 rounded">
        <div class="flex justify-between items-center mb-3">
            <h2 class="font-semibold">Events</h2>
            <div class="event-actions">
                
                <a id="createEventBtn">
                    <button class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700">
                        Create New Event
                    </button>
                </a>
              
                <button id="duplicateEventBtn"
                class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700">
                  Duplicate Existing Event
                </button>
              
                <div id="duplicatePanel" class="duplicate-panel hidden">
                  <select id="duplicateSelect">
                    <option value="">-- Select an event to duplicate --</option>
                  </select>
                </div>
              </div>
  
        </div>

        <div class="mb-3 text-sm">
            <span class="inline-block bg-red-100 border border-red-300 px-2 py-1 rounded">
                Red fields indicate configuration issues — hover for details
            </span>
        </div>

        <table class="min-w-full text-sm">
            <thead>
                <tr class="text-left border-b">
                    <th class="py-2">Name</th>
                    <th class="py-2">Year</th>
                    <th class="py-2">Category</th>
                    <th class="py-2">Actions</th>
                </tr>
            </thead>
            <tbody id="eventsTable"></tbody>
        </table>
    </div>

    <!-- STUDENTS SECTION - Add this after the REQUIREMENTS section and before EVENTS LIST -->
    <div id="students-section" class="bg-white shadow p-4 rounded mb-6">

        <!-- Header: two columns -->
        <div class="grid grid-cols-2 gap-6 mb-4">

            <!-- Column 1 -->
            <div class="flex flex-col justify-between">
                <h2 class="font-semibold text-lg">Students</h2>

                <!-- CSV Upload -->
                <div class="mt-4">
                    <input type="file" id="csvFile" accept=".csv" class="hidden" />
                    <button
                        type="button"
                        onclick="document.getElementById('csvFile').click()"
                        class="bg-blue-600 text-white px-3 py-2 rounded hover:bg-blue-700">
                        Upload CSV
                    </button>
                    <span id="csvFileName"
                            class="ml-2 text-sm text-gray-600"></span>
                </div>
            </div>

            <!-- Column 2 -->
            <form id="newStudentForm"
                    class="flex flex-col gap-2 items-end">

                <input id="newStudentName"
                        class="border rounded px-2 py-1 w-full"
                        placeholder="Name" />
                
                <select id="newStudentHouse" class="border rounded px-2 py-1 w-full">
                    <option value="">Select House...</option>
                </select>

                <select id="newStudentYear" class="border rounded px-2 py-1 w-full">
                    <option value="">Select Year...</option>
                </select>


                <button type="submit"
                        class="mt-2 bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">
                    Add New Student
                </button>
            </form>
        </div>

        <!-- Upload warnings -->
        <div id="uploadWarnings" class="hidden warning-box mb-4"></div>

        <!-- Students Table (full width) -->
        <div class="overflow-auto h-[60vh] border rounded">
            <table class="min-w-full text-sm">
                <thead>
                    <tr id="student-header-row" class="text-left border-b"></tr>
                    <tr id="student-filter-row" class="text-left border-b"></tr>
                </thead>
                <tbody id="studentsTable">
                    <tr>
                        <td colspan="4"
                            class="py-4 text-center text-gray-500">
                            No students loaded
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script type="module" src="/static/scripts/pages/admin_sportsday.js"></script>



</body>
</html>
