<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="/static/style.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Minimal styles for highlights, can be expanded */
        .row-highlight-error { background-color: #fee2e2; }
        .row-highlight-warning { background-color: #ffedd5; }
        .row-highlight-ok { background-color: #dcfce7; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="max-w-7xl mx-auto p-4">
    <div class="flex justify-between items-center mb-4">
        <div>
            <h1 id="title" class="text-2xl font-bold">Sports Day</h1>
            <p id="loggedInUser" class="text-sm text-gray-600">Loading...</p>
        </div>
        <button id="logoutBtn" class="bg-red-600 text-white px-3 py-2 rounded hover:bg-red-700">
            Logout
        </button>
    </div>

    <!-- TABS -->
    <div class="mb-4 border-b border-gray-200">
        <nav id="tabs-nav" class="-mb-px flex space-x-6" aria-label="Tabs">
            <!-- Tabs will be dynamically inserted here based on role -->
            <button data-tab="students" class="tab-button hidden whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm">Students</button>
            <button data-tab="results" class="tab-button hidden whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm">Results</button>
        </nav>
    </div>

    <!-- TAB PANES -->
    <div id="tab-panes-container">
        <!-- STUDENTS PANE -->
        <div id="students-pane" data-pane="students" class="tab-pane hidden">
            <div class="bg-white shadow p-4 rounded">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-semibold text-lg">Students</h2>
                    <div class="hidden">
                        <button id="showHighlightsBtn" type="button" class="ml-4 bg-gray-200 text-gray-800 px-3 py-2 rounded hover:bg-gray-300">
                            Show Highlights
                        </button>
                    </div>
                </div>
                <div class="overflow-auto h-[70vh] border rounded">
                    <table class="min-w-full text-sm">
                        <thead>
                            <tr id="student-header-row" class="text-left border-b"></tr>
                            <tr id="student-filter-row" class="text-left border-b"></tr>
                        </thead>
                        <tbody id="studentsTable">
                            <tr><td colspan="4" class="py-4 text-center text-gray-500">Loading students...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- RESULTS PANE (for Event Stewards) -->
        <div id="results-pane" data-pane="results" class="tab-pane hidden">
            <div class="bg-white shadow p-4 rounded">
                <div class="mb-4">
                    <select id="event-results-select" class="w-full md:w-1/2 p-2 border rounded"></select>
                </div>
                <div id="event-results-container" class="overflow-auto">
                    <!-- Results table will be rendered here -->
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script type="module" src="/static/scripts/pages/staff_dashboard.js"></script>

</body>
</html>
